<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECC Desk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#1a1a2e;color:#fff;min-height:100vh}
.wrap{max-width:420px;margin:0 auto;padding:32px 16px}
.logo{font-size:3rem;text-align:center}
h1{color:#00d4aa;text-align:center;margin:8px 0 4px}
.sub{color:#aaa;text-align:center;margin:0 0 24px}
.card{background:#24243e;border-radius:14px;padding:20px}
input{width:100%;box-sizing:border-box;padding:14px;margin-bottom:12px;border:1px solid #444;border-radius:10px;background:#1a1a2e;color:#fff;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#00d4aa;color:#1a1a2e;font-size:16px;font-weight:bold}
.ghost{width:auto;padding:8px 14px;background:transparent;color:#00d4aa;border:1px solid #00d4aa}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.msg{color:#ff8080;text-align:center;min-height:20px}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #333}
.role{color:#00d4aa;font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🏗️</div>
  <h1>ECC Desk</h1>
  <p class="sub">Easy Core Cut General Contracting</p>

  <div id="login" class="card">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
    <button id="btnLogin">Login</button>
    <p id="msg" class="msg"></p>
  </div>

  <div id="app" class="card" hidden>
    <div class="row"><span id="who"></span><button id="btnOut" class="ghost">Logout</button></div>
    <h2>👷 Staff</h2>
    <ul id="staff"></ul>
  </div>
</div>

<script>
const sb = supabase.createClient(
  'https://oxylqwfnfclfrdztxehc.supabase.co',
  'sb_publishable_bKOLPHV4dzHdyhQZweIwBQ_zCxE8bN6'
);
const $ = id => document.getElementById(id);

async function show() {
  const { data: { session } } = await sb.auth.getSession();
  $('login').hidden = !!session;
  $('app').hidden = !session;
  if (!session) return;
  $('who').textContent = session.user.email;
  const { data, error } = await sb.from('staff').select('name, role').order('id');
  $('staff').innerHTML = '';
  if (error) { $('staff').textContent = 'Error: ' + error.message; return; }
  data.forEach(s => {
    const li = document.createElement('li');
    li.innerHTML = '<span></span><span class="role"></span>';
    li.children[0].textContent = s.name;
    li.children[1].textContent = s.role;
    $('staff').appendChild(li);
  });
}

$('btnLogin').onclick = async () => {
  $('msg').textContent = 'Please wait...';
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('pass').value
  });
  $('msg').textContent = error ? 'Wrong email or password' : '';
  show();
};

$('btnOut').onclick = async () => { await sb.auth.signOut(); show(); };

show();
</script>
</body>
</html>
