<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECC Desk Import</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#1a1a2e;color:#fff;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:24px 16px 48px}
h1{color:#00d4aa;text-align:center;margin:8px 0 16px}
.card{background:#24243e;border-radius:14px;padding:18px;margin-bottom:14px}
input{width:100%;box-sizing:border-box;padding:12px;margin-bottom:10px;border:1px solid #444;border-radius:10px;background:#1a1a2e;color:#fff;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#00d4aa;color:#1a1a2e;font-size:16px;font-weight:bold}
button:disabled{opacity:.5}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #333}
.small{color:#aaa;font-size:13px}
.warn{color:#ffb84d}.bad{color:#ff8080}.ok{color:#00d4aa}
#log{white-space:pre-wrap;font-size:13px;color:#ccc;margin-top:10px}
a{color:#00d4aa}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>📥 Import old data</h1>
  <div class="card" id="needLogin" hidden>
    <p>Please log in to ECC Desk first, then open this page again.</p>
    <a href="app.html">Go to ECC Desk</a>
  </div>
  <div id="main" hidden>
    <div class="card">
      <p class="small">Logged in as <span id="who"></span></p>
      <label class="small">1. Choose the file <b>ecc-old-data.json</b></label>
      <input type="file" id="file" accept=".json,application/json">
      <div id="summary"></div>
    </div>
    <div class="card" id="step2" hidden>
      <p id="already" class="warn" hidden></p>
      <label id="forceBox" hidden><input type="checkbox" id="force" style="width:auto"> Import anyway (may create duplicates)</label>
      <button id="go">2. Import now</button>
      <div id="log"></div>
    </div>
  </div>
</div>
<script>
const sb = supabase.createClient('https://oxylqwfnfclfrdztxehc.supabase.co','sb_publishable_bKOLPHV4dzHdyhQZweIwBQ_zCxE8bN6');
const $ = id => document.getElementById(id);
let data = null;
const log = t => { $('log').textContent += t + '\n'; };
const chunks = (a, n) => { const r = []; for (let i = 0; i < a.length; i += n) r.push(a.slice(i, i + n)); return r; };

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('needLogin').hidden = false; return; }
  $('main').hidden = false; $('who').textContent = session.user.email;
  const { count } = await sb.from('customers').select('id', { count: 'exact', head: true });
  if (count > 50) { $('already').hidden = false; $('forceBox').hidden = false;
    $('already').textContent = '⚠️ There are already ' + count + ' customers in the database. Old data may have been imported before.'; }
})();

$('file').onchange = async () => {
  const f = $('file').files[0]; if (!f) return;
  try { data = JSON.parse(await f.text()); } catch (e) { $('summary').innerHTML = '<p class="bad">This is not the right file.</p>'; return; }
  if (!data.customers || !data.jobs) { $('summary').innerHTML = '<p class="bad">This is not the right file.</p>'; return; }
  const s = $('summary'); s.innerHTML = '';
  [['Customers', data.customers.length], ['Jobs', data.jobs.length], ['Payments', (data.payments || []).length], ['Expenses', (data.expenses || []).length]]
    .forEach(([k, v]) => { const d = document.createElement('div'); d.className = 'kv'; d.innerHTML = '<span></span><b></b>';
      d.children[0].textContent = k; d.children[1].textContent = v; s.appendChild(d); });
  $('step2').hidden = false;
};

$('go').onclick = async () => {
  if (!$('forceBox').hidden && !$('force').checked) { log('Tick "Import anyway" first.'); return; }
  $('go').disabled = true; $('file').disabled = true;
  try {
    // 1. Customers (skip phones already in DB)
    const existing = {};
    for (let from = 0; ; from += 1000) {
      const { data: rows, error } = await sb.from('customers').select('id, phone').range(from, from + 999);
      if (error) throw error;
      rows.forEach(r => { if (r.phone) existing[r.phone] = r.id; });
      if (rows.length < 1000) break;
    }
    const newCust = data.customers.filter(c => !(c.phone && existing[c.phone]));
    let n = 0;
    for (const part of chunks(newCust, 200)) {
      const { data: rows, error } = await sb.from('customers').insert(part).select('id, phone');
      if (error) throw error;
      rows.forEach(r => { if (r.phone) existing[r.phone] = r.id; });
      n += rows.length; log('Customers: ' + n + ' / ' + newCust.length);
    }
    const cid = m => (m && existing[m]) || null;

    // 2. Staff ids for expenses
    const { data: staff } = await sb.from('staff').select('id, name');
    const staffId = text => { const s = (staff || []).find(x => new RegExp('\\b' + x.name + '\\b', 'i').test(text || '')); return s ? s.id : null; };

    // 3. Jobs
    n = 0;
    for (const part of chunks(data.jobs, 200)) {
      const rows = part.map(j => { const { mobile, ...rest } = j; return { ...rest, customer_id: cid(mobile) }; });
      const { error } = await sb.from('jobs').insert(rows);
      if (error) throw error;
      n += rows.length; log('Jobs: ' + n + ' / ' + data.jobs.length);
    }
    // 4. Payments
    n = 0;
    for (const part of chunks(data.payments || [], 200)) {
      const rows = part.map(p => { const { mobile, ...rest } = p; return { ...rest, customer_id: cid(mobile) }; });
      const { error } = await sb.from('payments').insert(rows);
      if (error) throw error;
      n += rows.length; log('Payments: ' + n + ' / ' + data.payments.length);
    }
    // 5. Expenses
    n = 0;
    for (const part of chunks(data.expenses || [], 200)) {
      const rows = part.map(e => ({ ...e, staff_id: staffId(e.notes) }));
      const { error } = await sb.from('expenses').insert(rows);
      if (error) throw error;
      n += rows.length; log('Expenses: ' + n + ' / ' + data.expenses.length);
    }
    log('\n✅ Import finished. You can now delete the file from your phone.');
    $('log').className = 'ok';
  } catch (e) {
    log('\n❌ Error: ' + (e.message || e) + '\nTake a screenshot and send it to Claude. Do not press Import again.');
  }
};
</script>
</body>
</html>
