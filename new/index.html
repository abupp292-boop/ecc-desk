<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ECC Desk">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>ECC Desk</title>
  <script type="module" crossorigin src="./assets/index-YElDtFH4.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-D-HNoYWU.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo">🏗️</span><div><h1>ECC Desk</h1><p class="sub">Easy Core Cut General Contracting</p></div></div>
  </header>

  <!-- LOGIN -->
  <form id="login" class="card" method="post" action="#" hidden>
    <h2>Login</h2>
    <input id="email" name="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pass" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit" class="main-btn">Login</button>
    <p id="msg" class="msg"></p>
  </form>

  <!-- HOME -->
  <main id="home" hidden>
    <div class="who-row"><span id="who" class="small"></span><button id="btnOut" class="link-btn">Logout</button></div>
    <p style="margin:-4px 0 12px"><a href="#password" class="small" style="color:var(--accent)">🔑 Change password</a></p>

    <div class="search card">
      <input id="q" type="search" placeholder="🔍 Customer, mobile, site or order no." autocomplete="off" enterkeyhint="search">
      <ul id="results" class="results" hidden></ul>
    </div>

    <div class="quick">
      <a class="qbtn" data-go="jobs" data-open="1">➕<span>New job</span></a>
      <a class="qbtn" data-go="report" data-open="1">📋<span>Daily report</span></a>
      <a class="qbtn owner-only" data-go="money" data-open="2" hidden>🧾<span>Expense</span></a>
    </div>

    <div id="alerts"></div>

    <div class="today card">
      <div><b id="sJobs">–</b><span>Jobs today</span></div>
      <div><b id="sOrders">–</b><span>Open orders</span></div>
      <div><b id="sDocs">–</b><span>Docs due</span></div>
    </div>
    <div class="today card owner-only" hidden>
      <div><b id="sIn">–</b><span>Received this month</span></div>
      <div><b id="sOut">–</b><span>Expenses this month</span></div>
    </div>

    <div class="tiles" id="tiles"></div>
  </main>

  <!-- SECTION -->
  <section id="section" hidden>
    <button id="back" class="back">← Home</button>
    <h2 id="secTitle" class="sec-title"></h2>
    <div class="menu" id="secMenu"></div>
  </section>

  <!-- CHANGE PASSWORD -->
  <section id="pwd" hidden>
    <button id="pBack" class="back">← Home</button>
    <h2 class="sec-title">🔑 Change password</h2>
    <form id="pwdForm" class="card" method="post" action="#">
      <input id="pwdUser" name="username" type="email" autocomplete="username" readonly>
      <label class="lbl" for="pwd1">New password (at least 8 characters)</label>
      <input id="pwd1" name="new-password" type="password" autocomplete="new-password" minlength="8" required>
      <label class="lbl" for="pwd2">Type it again</label>
      <input id="pwd2" name="new-password-again" type="password" autocomplete="new-password" minlength="8" required>
      <label class="small" style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><input id="pwdShow" type="checkbox" style="width:22px;height:22px;margin:0"> Show password</label>
      <button type="submit" class="main-btn">Save new password</button>
      <p id="pwdMsg" class="msg"></p>
    </form>
  </section>

  <!-- MONEY RECORDS (owner only, read only) -->
  <section id="view" hidden>
    <button id="vBack" class="back">← Money</button>
    <h2 id="vTitle" class="sec-title"></h2>
    <div class="card">
      <label class="lbl" for="vMonth">Month</label>
      <input id="vMonth" type="month">
      <input id="vQ" type="search" placeholder="🔍 Search in this month" autocomplete="off" style="margin:0">
    </div>
    <div class="today card" id="vStats"></div>
    <div class="card"><p class="small" id="vCount" style="margin:0 0 6px"></p><ul id="vList" class="vlist"></ul></div>
  </section>
</div>
</body>
</html>
